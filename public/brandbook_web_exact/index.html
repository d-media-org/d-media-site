        <text x="72.000" y="427.640" font-family="Panton Regular" font-size="15.000" fill="#000000">авторска посока.</text>
        <text x="72.000" y="498.900" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">Развитие</text>
        <text x="72.000" y="526.240" font-family="Panton Black" font-size="24.000" fill="#000000">От описателни имена към универсална форма</text>
        <text x="72.000" y="571.640" font-family="Panton Regular" font-size="15.000" fill="#000000">С времето по-дългите и описателни идентичности</text>
        <text x="72.000" y="595.640" font-family="Panton Regular" font-size="15.000" fill="#000000">отстъпват място на по-кратък и устойчив знак,</text>
        <text x="72.000" y="619.640" font-family="Panton Regular" font-size="15.000" fill="#000000">способен да работи извън една конкретна услуга или индустрия.</text>
        <text x="72.000" y="688.900" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">Днес</text>
        <text x="72.000" y="716.240" font-family="Panton Black" font-size="24.000" fill="#000000">d . media събира име, обхват и дигитален характер</text>
        <text x="72.000" y="776.640" font-family="Panton Regular" font-size="15.000" fill="#000000">Настоящото име обединява произхода на буквата d,</text>
        <text x="72.000" y="800.640" font-family="Panton Regular" font-size="15.000" fill="#000000">широтата на media и ролята на точката като ос на баланс,</text>
        <text x="72.000" y="824.640" font-family="Panton Regular" font-size="15.000" fill="#000000">ритъм и цифрова асоциация.</text>
        <text x="700.000" y="884.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Кратък смислов извод</text>
        <text x="700.000" y="916.460" font-family="Panton Black" font-size="21.000" fill="#000000">Брандът не е жанр, а рамка</text>
        <text x="700.000" y="956.380" font-family="Panton Regular" font-size="14.500" fill="#000000" letter-spacing="-0.012em">d . media функционира като отворена система за дизайн, текст,</text>
        <text x="700.000" y="975.955" font-family="Panton Regular" font-size="14.500" fill="#000000" letter-spacing="-0.012em">публикации и дигитални носители.</text>
        <text x="820.000" y="514.160" font-family="Panton Black" font-size="16.000" fill="#000000" text-anchor="middle">MD media design</text>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">А. Стратегическа рамка</text>
        <text x="1828.496" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">05</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Мисия и основно послание</text>
        <text x="92.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Мисия</text>
        <text x="92.000" y="400.460" font-family="Panton Black" font-size="21.000" fill="#000000">Независима творческа медийна платформа</text>
        <text x="92.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">d . media събира дизайн, текст, технологии и културно</text>
        <text x="92.000" y="461.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">съдържание в една работеща обща система.</text>
        <text x="92.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Основно послание</text>
        <text x="92.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Формата е част от съдържанието</text>
        <text x="92.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Всеки носител трябва да внушава яснота, редакционна</text>
        <text x="92.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">точност и дисциплина.</text>
        <text x="696.000" y="800.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Основен знак</text>
        <text x="1160.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Функция на бранда</text>
        <text x="1160.000" y="400.460" font-family="Panton Black" font-size="21.000" fill="#000000">Платформа, а не агенция</text>
        <text x="1160.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Брандът е рамка за медийни формати, визуални системи, авторски публикации и</text>
        <text x="1160.000" y="461.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">дигитални носители.</text>
        <text x="1160.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Оперативен извод</text>
        <text x="1160.000" y="651.940" font-family="Panton Black" font-size="19.000" fill="#000000">Всички материали трябва да остават отворени към различни формати</text>
        <text x="1160.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Всеки нов носител се адаптира през същата логика: монохромност, йерархия,</text>
        <text x="1160.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">въздух и дисциплина.</text>
      </svg>
    </section>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">А. Стратегическа рамка</text>
        <text x="1827.904" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">06</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Различие, ценности и характер</text>
        <text x="92.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">В какво е различен</text>
        <text x="92.000" y="402.680" font-family="Panton Black" font-size="18.000" fill="#000000">Работи еднакво добре като бранд и като авторска рамка</text>
        <text x="92.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Системата държи едновременно студийно представяне,</text>
        <text x="92.000" y="461.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">редакционно съдържание и лични културни проекти.</text>
        <text x="92.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Ценности</text>
        <text x="92.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Яснота</text>
        <text x="92.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Нищо не трябва да звучи</text>
        <text x="92.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">или изглежда излишно</text>
        <text x="92.000" y="733.580" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">усложнено.</text>
        <text x="372.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Ценности</text>
        <text x="372.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Последователност</text>
        <text x="372.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Всяка употреба трябва да</text>
        <text x="372.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">бъде разпознаваема като</text>
        <text x="372.000" y="733.580" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">част от една система.</text>
        <text x="700.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Ценности</text>
        <text x="700.000" y="400.460" font-family="Panton Black" font-size="21.000" fill="#000000">Независимост</text>
        <text x="700.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Брандът не заема готов език, а изгражда собствен</text>
        <text x="700.000" y="461.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">редакционен ритъм.</text>
        <text x="700.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Ценности</text>
        <text x="700.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Културна тежест</text>
        <text x="700.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Съдържанието не се третира като шум, а като аргумент,</text>
        <text x="700.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">който трябва да бъде подреден.</text>
        <text x="1308.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Характер</text>
        <text x="1308.000" y="400.460" font-family="Panton Black" font-size="21.000" fill="#000000">Минимален, редакционен, точен</text>
        <text x="1308.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Тонът е спокоен, категоричен и премерен.</text>
        <text x="1308.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Поведенческо правило</text>
        <text x="1308.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Без визуален шум</text>
        <text x="1308.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Декоративни ефекти, случайни акценти и претрупани</text>
        <text x="1308.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">композиции противоречат на d . media.</text>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">А. Стратегическа рамка</text>
        <text x="1829.488" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">07</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Аудитории, тон и контекст</text>
        <text x="92.000" y="358.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">На кого говорим</text>
        <text x="92.000" y="390.460" font-family="Panton Black" font-size="21.000" fill="#000000">Професионални аудитории</text>
        <text x="92.000" y="430.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Дизайн среди, студиа, издатели, културни</text>
        <text x="92.000" y="451.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">организации и хора, за които формата и</text>
        <text x="92.000" y="473.580" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">аргументът са еднакво важни.</text>
        <text x="542.000" y="358.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">На кого говорим</text>
        <text x="542.000" y="390.460" font-family="Panton Black" font-size="21.000" fill="#000000">Редакционни аудитории</text>
        <text x="542.000" y="430.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Читатели, наблюдатели и общности, които</text>
        <text x="542.000" y="451.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">влизат през съдържанието, но остават заради</text>
        <text x="542.000" y="473.580" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">последователната визуална рамка.</text>
        <text x="992.000" y="358.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">На кого говорим</text>
        <text x="992.000" y="390.460" font-family="Panton Black" font-size="21.000" fill="#000000">Дигитални аудитории</text>
        <text x="992.000" y="430.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Социални мрежи, уеб читатели и културни</text>
        <text x="992.000" y="451.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">публики, които срещат марката през кратки,</text>
        <text x="992.000" y="473.580" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">но ясно структурирани формати.</text>
        <text x="1442.000" y="358.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Тон</text>
        <text x="1442.000" y="390.460" font-family="Panton Black" font-size="21.000" fill="#000000">Категоричен без патос</text>
        <text x="1442.000" y="430.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">d . media говори спокойно, без рекламна поза,</text>
        <text x="1442.000" y="451.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">без хиперболи и без неясни обещания.</text>
        <text x="92.000" y="658.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Как звучим</text>
        <text x="92.000" y="690.460" font-family="Panton Black" font-size="21.000" fill="#000000">Кратко. Стегнато. Смислово.</text>
        <text x="92.000" y="730.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Кратките формати са концентрирани. Дългите работят с ясен</text>
        <text x="92.000" y="751.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">ритъм и отчетлива структура.</text>
        <text x="684.000" y="658.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Как не звучим</text>
        <text x="684.000" y="690.460" font-family="Panton Black" font-size="21.000" fill="#000000">Не инфламираме езика</text>
        <text x="684.000" y="730.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Без шумни формулировки, фалшива скромност и жаргон без</text>
        <text x="684.000" y="751.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">функция.</text>
        <text x="1276.000" y="658.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Контекст на употреба</text>
        <text x="1276.000" y="690.460" font-family="Panton Black" font-size="21.000" fill="#000000">Системата трябва да издържа в различни мащаби</text>
        <text x="1276.000" y="730.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Брандът трябва да остане разпознаваем от малка икона до сайт,</text>
        <text x="1276.000" y="751.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">корица, плакат и PDF.</text>
      </svg>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">А. Стратегическа рамка</text>
        <text x="1828.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">08</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Архитектура, именуване и смислова логика</text>
        <text x="92.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Архитектура</text>
        <text x="92.000" y="400.460" font-family="Panton Black" font-size="21.000" fill="#000000">Една марка, много носители</text>
        <text x="92.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">d . media е централен идентификатор за уеб, социално</text>
        <text x="92.000" y="461.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">съдържание, издания, обекти и видео.</text>
        <text x="92.000" y="628.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Именуване</text>
        <text x="92.000" y="660.460" font-family="Panton Black" font-size="21.000" fill="#000000">Името винаги се пише точно така: d . media</text>
        <text x="92.000" y="700.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Интервалите около точката са задължителни. Не се допуска</text>
        <text x="92.000" y="721.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">слепване, отпадане на точката, смяна на регистъра или</text>
        <text x="92.000" y="743.580" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">стилистични модификации.</text>
        <text x="716.000" y="800.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Основен знак</text>
        <text x="1140.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Смислов пласт</text>
        <text x="1140.000" y="400.460" font-family="Panton Black" font-size="21.000" fill="#000000">Дигиталната препратка остава концептуална, не графична</text>
        <text x="1140.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Идеята за адресен дигитален знак е смислова препратка, но не се използва като</text>
        <text x="1140.000" y="461.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">самостоятелен графичен елемент.</text>
        <text x="1140.000" y="628.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Оперативно правило</text>
        <text x="1140.000" y="660.460" font-family="Panton Black" font-size="21.000" fill="#000000">Дори в малък мащаб се ползва логото</text>
        <text x="1140.000" y="700.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">При аватар, favicon и app icon се използва редуцираното основно лого.</text>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">Б. Идентичност</text>
        <text x="1830.864" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">10</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Логосистема и смислова конструкция</text>
        <text x="88.000" y="684.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Основно лого</text>
        <text x="486.000" y="464.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Основен логотип</text>
        <text x="486.000" y="724.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Оригинален sketch logotype</text>
        <text x="1284.000" y="724.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Преход към финалния знак</text>
        <text x="92.000" y="828.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Как е създадено</text>
        <text x="92.000" y="860.460" font-family="Panton Black" font-size="21.000" fill="#000000">От конструктивен чертеж към стабилен знак</text>
        <text x="92.000" y="900.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Sketch логотипът показва, че формата е построена през</text>
        <text x="92.000" y="921.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">grid, оптичен баланс, контрол върху кривите и ясна роля на</text>
        <text x="92.000" y="943.580" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">точката.</text>
        <text x="644.000" y="828.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Какво носи</text>
        <text x="644.000" y="860.460" font-family="Panton Black" font-size="21.000" fill="#000000">Яснота, цифров характер и редакционна тежест</text>
        <text x="644.000" y="900.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Кръглата конструкция около d, спокойният ритъм на буквите и</text>
        <text x="644.000" y="921.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">отделената точка създават усещане за система, среда и</text>
        <text x="644.000" y="943.580" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">прецизност.</text>
        <text x="1240.000" y="828.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Смислово послание</text>
        <text x="1240.000" y="860.460" font-family="Panton Black" font-size="21.000" fill="#000000">Името не е надпис, а подредена медийна рамка</text>
        <text x="1240.000" y="900.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Логото и логотипът казват, че d . media е компактна, съвременна и</text>
        <text x="1240.000" y="921.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">отворена платформа, в която форма и съдържание работят заедно.</text>

        <text x="1833.856" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">11</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Варианти, фонове и lockup логика</text>
        <text x="88.000" y="580.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Логотип върху светъл фон</text>
        <text x="88.000" y="874.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Логотип върху тъмен фон</text>
        <text x="956.000" y="580.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Основен знак</text>
        <text x="1344.000" y="580.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Редуциран кадър</text>
        <text x="960.000" y="692.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Основно правило</text>
        <text x="960.000" y="724.460" font-family="Panton Black" font-size="21.000" fill="#000000">Първо логотип, после лого</text>
        <text x="960.000" y="764.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">При наличие на достатъчно ширина и четивно</text>
        <text x="960.000" y="785.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">поле се използва логотипът. Логото е вторият</text>
        <text x="960.000" y="807.580" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">избор за кратък мащаб.</text>
        <text x="1428.000" y="692.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Lockup логика</text>
        <text x="1428.000" y="724.460" font-family="Panton Black" font-size="21.000" fill="#000000">Не пренареждай елементите</text>
        <text x="1428.000" y="764.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Не се създават нови композиции чрез механично</text>
        <text x="1428.000" y="785.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">разместване на логото и логотипа.</text>
        <text x="72.000" y="920.680" font-family="Panton Regular" font-size="18.000" fill="#000000">Широки формати като уеб header, корица и документен header използват логотип. Малки полета и квадратни иконни формати използват логото.</text>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">Б. Идентичност</text>
        <text x="1831.232" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">13</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Правилна и неправилна употреба</text>
        <text x="88.000" y="600.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Правилно: утвърден вариант</text>
        <text x="646.000" y="600.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Грешно: неутвърден цвят</text>
        <text x="1064.000" y="600.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Грешно: деформирана пропорция</text>
        <text x="1482.000" y="600.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Грешно: променена ориентация</text>
        <text x="92.000" y="678.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Коректна употреба</text>
        <text x="92.000" y="710.460" font-family="Panton Black" font-size="21.000" fill="#000000">Правилен вариант за правилния носител</text>
        <text x="92.000" y="750.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Логотипът се пази за широки формати, а логото за компактни</text>
        <text x="92.000" y="771.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">приложения и малък мащаб.</text>
        <text x="682.000" y="678.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Цветови грешки</text>
        <text x="682.000" y="710.460" font-family="Panton Black" font-size="21.000" fill="#000000">Без произволни оцветявания</text>
        <text x="682.000" y="750.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Не се допуска подмяна на монохромната система с произволни</text>
        <text x="682.000" y="771.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">цветове, градиенти и ефекти.</text>
        <text x="1272.000" y="678.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Формални грешки</text>
        <text x="1272.000" y="710.460" font-family="Panton Black" font-size="21.000" fill="#000000">Без разтягане, ротация и фалшиви lockup-и</text>
        <text x="1272.000" y="750.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Забранени са разтягане, завъртане, отделяне на части и</text>
        <text x="1272.000" y="771.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">механична промяна на конструкцията.</text>
      </svg>
    </section>

        <text x="970.000" y="398.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Цветова политика</text>
        <text x="970.000" y="431.200" font-family="Panton Black" font-size="20.000" fill="#000000">Монохромност с контролирана градация</text>
        <text x="970.000" y="470.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Ядрото на системата не допуска произволно</text>
        <text x="970.000" y="491.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">добавяне на акцентни цветове.</text>
        <text x="1420.000" y="398.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Пропорция</text>
        <text x="1420.000" y="431.200" font-family="Panton Black" font-size="20.000" fill="#000000">Черно за съдържание, сиво за структура</text>
        <text x="1420.000" y="470.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Черното държи headline-а и основния текст,</text>
        <text x="1420.000" y="491.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">сивото е за метаданни и структура.</text>
        <text x="970.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Контраст</text>
        <text x="970.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">Четимостта е по-важна от ефекта</text>
        <text x="970.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Когато фонът отслабва контраста, се</text>
        <text x="970.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">преминава към по-ясен вариант.</text>
        <text x="1420.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Какво се избягва</text>
        <text x="1420.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">Без декоративни полутонове</text>
        <text x="1420.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Случайни прозрачности, текстури и цветни</text>
        <text x="1420.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">overlays не заместват йерархията.</text>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">Б. Идентичност</text>
        <text x="1830.896" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">16</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Типографски стил и изписване в текст</text>
        <text x="92.000" y="398.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Изписване в текст</text>
        <text x="92.000" y="430.460" font-family="Panton Black" font-size="21.000" fill="#000000">Винаги точно: d . media</text>
        <text x="92.000" y="470.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Не се допуска d.media, D . media, D.Media, d-media или друга</text>
        <text x="92.000" y="491.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">стилизация.</text>
        <text x="92.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Равнение</text>
        <text x="92.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Предимно ляво, рядко център</text>
        <text x="92.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">При по-дълги текстове се използва ляво равнение. Центърът</text>
        <text x="92.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">е за корици и единични кратки формати.</text>
        <text x="92.000" y="838.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Ритъм</text>
        <text x="92.000" y="870.460" font-family="Panton Black" font-size="21.000" fill="#000000">Големи паузи, не тесни блокове</text>
        <text x="92.000" y="910.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Текстът трябва да диша. Междуредията и полетата не са</text>
        <text x="92.000" y="931.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">остатъчно място.</text>
        <text x="700.000" y="398.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Headline стил</text>
        <text x="700.000" y="430.460" font-family="Panton Black" font-size="21.000" fill="#000000">Кратък, стегнат, аргументативен</text>
        <text x="700.000" y="470.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Заглавията работят с прости структури и без рекламни формули.</text>
        <text x="700.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Caption стил</text>
        <text x="700.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Фактологичен и чист</text>
        <text x="700.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Подписи и meta редове назовават, класифицират и дават</text>
        <text x="700.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">контекст.</text>
        <text x="700.000" y="838.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">В документи</text>
        <text x="695.000" y="871.940" font-family="Panton Black" font-size="19.000" fill="#000000">Текстът d . media може да стои и като типографски надпис</text>
        <text x="700.000" y="910.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Името може да бъде изписвано с Panton Black в черно, а при нужда и</text>
        <text x="700.000" y="931.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">с оригиналните цветове от логото. При титулни и header зони е</text>
        <text x="700.000" y="953.580" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">допустим и оригиналният логотип.</text>
        <text x="1308.000" y="398.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Пример</text>
        <text x="1308.000" y="430.460" font-family="Panton Black" font-size="21.000" fill="#000000">Формата е част от съдържанието.</text>
        <text x="1308.000" y="470.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Headline, който звучи като позиция, а не като слоган без опора.</text>
        <text x="1308.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Пример</text>
        <text x="1308.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Редакционна система за дълга форма.</text>
        <text x="1308.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Подзаглавие, което обяснява какво следва, без да раздува тона.</text>
        <text x="1308.000" y="838.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Пример</text>
        <text x="1308.000" y="872.680" font-family="Panton Black" font-size="18.000" fill="#000000">Бележка: използвай редуцирано лого при дребен мащаб.</text>
        <text x="1308.000" y="910.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Кратка инструкция, написана спокойно и точно.</text>
      </svg>
    </section>

        <text x="1828.432" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">20</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Социална система</text>
        <text x="88.000" y="648.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Профил</text>
        <text x="348.000" y="648.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Квадратен пост</text>
        <text x="608.000" y="674.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Цитатен пост</text>
        <text x="888.000" y="704.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Вертикален формат</text>
        <text x="1152.000" y="666.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Корица за статия</text>
        <text x="92.000" y="826.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Задължителни реквизити</text>
        <text x="92.000" y="858.460" font-family="Panton Black" font-size="21.000" fill="#000000">Лого за профил и story, логотип за cover</text>
        <text x="92.000" y="898.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Квадратните и вертикалните формати работят добре с</text>
        <text x="92.000" y="919.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">логото. Широките cover формати могат да носят логотип.</text>
        <text x="684.000" y="826.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Платформен принцип</text>
        <text x="684.000" y="858.460" font-family="Panton Black" font-size="21.000" fill="#000000">Форматът се мени, системата не</text>
        <text x="684.000" y="898.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Пропорцията може да се сменя, но не и типографската логика,</text>
        <text x="684.000" y="919.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">цветовата дисциплина и изборът на правилния знак.</text>
        <text x="1276.000" y="826.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Какво се избягва</text>
        <text x="1276.000" y="858.460" font-family="Panton Black" font-size="21.000" fill="#000000">Не превръщай social-а в шумна реклама</text>
        <text x="1276.000" y="898.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Без крещящи callout-и, агресивни акценти, претрупване с текст и</text>
        <text x="1276.000" y="919.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">произволна смяна между лого и логотип.</text>

        <text x="92.000" y="780.460" font-family="Panton Black" font-size="21.000" fill="#000000">Една главна ос и ясна навигация</text>
        <text x="92.000" y="820.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Сайтът работи с чиста навигация, изразена</text>

        <text x="92.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Имената описват вида на актива, варианта и контекста на</text>
        <text x="92.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">употреба.</text>
        <text x="680.000" y="378.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">При партньорства</text>
        <text x="680.000" y="410.460" font-family="Panton Black" font-size="21.000" fill="#000000">Не преправяй активите локално</text>
        <text x="680.000" y="450.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Към външни студиа и разработчици се подават официалните</text>
        <text x="680.000" y="471.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">assets.</text>
        <text x="680.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">При exports</text>
        <text x="680.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">SVG / PDF / PNG според задачата</text>
        <text x="680.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">SVG за идентичност, PNG за preview и social, PDF за наръчници и</text>
        <text x="680.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">печатни пакети.</text>
        <text x="1268.000" y="378.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Задължителни папки</text>
        <text x="1268.000" y="411.200" font-family="Panton Black" font-size="20.000" fill="#000000">logos / fonts / colors / icons / social / web / editorial / print</text>
        <text x="1268.000" y="450.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Това е минималният пакет, чрез който системата остава</text>
        <text x="1268.000" y="471.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">работоспособна.</text>
        <text x="1268.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Резервирано поле</text>
        <text x="1268.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">guidelines / approvals / exports</text>
        <text x="1268.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Тези папки пазят версията на правилата, одобрените отклонения и</text>
        <text x="1268.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">production exports.</text>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">Г. Приложения</text>
        <text x="1828.464" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">29</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Управление на системата</text>
        <text x="92.000" y="378.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Управленски принцип</text>
        <text x="92.000" y="410.460" font-family="Panton Black" font-size="21.000" fill="#000000">Системата е стегната, но не затворена</text>
        <text x="92.000" y="450.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Нови носители и кампанийни решения са допустими, ако минават</text>
        <text x="92.000" y="471.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">през основните правила на системата.</text>
        <text x="92.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Кога е допустимо изключение</text>
        <text x="92.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">Само когато носителят изисква друго поведение</text>
        <text x="92.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Изключение е допустимо при специфичен технологичен, печатен</text>
        <text x="92.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">или платформен контекст.</text>
        <text x="680.000" y="378.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Как се одобрява</text>
        <text x="680.000" y="410.460" font-family="Panton Black" font-size="21.000" fill="#000000">Сравни с ядрото на системата</text>
        <text x="680.000" y="450.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Всяко ново решение се тества срещу име, знак, цвят,</text>
        <text x="680.000" y="471.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">типография и ритъм.</text>
        <text x="680.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Какво се пази</text>
        <text x="680.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">Четимост, въздух и последователност</text>
        <text x="680.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">При всяка адаптация трябва да останат монохромната</text>
        <text x="680.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">дисциплина, типографската яснота и редакционната плътност.</text>
        <text x="1268.000" y="378.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Практически извод</text>
        <text x="1268.000" y="410.460" font-family="Panton Black" font-size="21.000" fill="#000000">Нов носител = ново приложение, не нова идентичност</text>
        <text x="1268.000" y="450.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Нов формат означава ново приложение на системата, не нов стил.</text>
        <text x="1268.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Финална бележка</text>
        <text x="1265.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">d . media трябва да остане разпознаваем и когато е тих</text>
        <text x="1268.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Силата на марката идва от постоянна структура, интелигентна</text>
        <text x="1268.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">икономия и уважение към съдържанието.</text>
