        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">A. Strategic framework</text>
        <text x="1828.240" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">03</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Introducing d . media</text>
        <text x="92.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Brief description</text>
        <text x="92.000" y="400.460" font-family="Panton Black" font-size="21.000" fill="#000000">Independent creative brand and media platform</text>
        <text x="92.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">d . media connects design, text, technology and digital culture in one</text>
        <text x="92.000" y="461.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">consistent identity.</text>
        <text x="92.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Summary</text>
        <text x="92.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">One system for many formats</text>
        <text x="92.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">The brand works through clear typography, monochrome discipline and</text>
        <text x="92.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">adaptive structure for web, social formats, documents and publications.</text>
        <text x="696.000" y="800.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Primary sign</text>
        <text x="1160.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">How it works</text>
        <text x="1160.000" y="400.460" font-family="Panton Black" font-size="21.000" fill="#000000">Content, form and rhythm</text>
        <text x="1160.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">The system should hold equally well in site, post, presentation, cover and small icon</text>
        <text x="1160.000" y="461.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">format without losing character.</text>
        <text x="1160.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">How it looks</text>
        <text x="1160.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Minimal, typographic, monochrome</text>
        <text x="1160.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">The language of d . media is built through Panton, generous margins, clear rhythm and</text>
        <text x="1160.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">controlled monochrome.</text>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">A. Strategic framework</text>
        <text x="1828.016" y="60.000" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">04</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">History and evolution of the brand</text>
        <text x="72.000" y="308.900" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">Origin</text>
        <text x="72.000" y="336.240" font-family="Panton Black" font-size="24.000" fill="#000000">From early visual experiments to a clear system</text>
        <text x="72.000" y="381.640" font-family="Panton Regular" font-size="15.000" fill="#000000">The development begins with an interest in visual communication, digital</text>
        <text x="72.000" y="404.640" font-family="Panton Regular" font-size="15.000" fill="#000000">tools and online environments that gradually shape a self</text>
        <text x="72.000" y="427.640" font-family="Panton Regular" font-size="15.000" fill="#000000">author&#x27;s direction.</text>
        <text x="72.000" y="498.900" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">Development</text>
        <text x="72.000" y="526.240" font-family="Panton Black" font-size="24.000" fill="#000000">From descriptive names to universal form</text>
        <text x="72.000" y="571.640" font-family="Panton Regular" font-size="15.000" fill="#000000">Over time, the longer and more descriptive identities</text>
        <text x="72.000" y="595.640" font-family="Panton Regular" font-size="15.000" fill="#000000">give way to a shorter and more persistent sign,</text>
        <text x="72.000" y="619.640" font-family="Panton Regular" font-size="15.000" fill="#000000">capable of operating outside of one particular service or industry.</text>
        <text x="72.000" y="688.900" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">Today</text>
        <text x="72.000" y="716.240" font-family="Panton Black" font-size="24.000" fill="#000000">d . media collects name, scope and numeric character</text>
        <text x="72.000" y="776.640" font-family="Panton Regular" font-size="15.000" fill="#000000">The current name combines the origin of the letter d,</text>
        <text x="72.000" y="800.640" font-family="Panton Regular" font-size="15.000" fill="#000000">the width of the media and the role of the point as an axis of balance,</text>
        <text x="72.000" y="824.640" font-family="Panton Regular" font-size="15.000" fill="#000000">rhythm and numerical association.</text>
        <text x="700.000" y="884.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">A short summary</text>
        <text x="700.000" y="916.460" font-family="Panton Black" font-size="21.000" fill="#000000">A brand is not a genre, but a framework</text>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">A. Strategic framework</text>
        <text x="1828.496" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">05</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Mission and Core Message</text>
        <text x="92.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Mission</text>
        <text x="92.000" y="400.460" font-family="Panton Black" font-size="21.000" fill="#000000">Independent creative media platform</text>
        <text x="92.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">d . media brings together design, text, technology and cultural</text>
        <text x="92.000" y="461.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">content in one working common system.</text>
        <text x="92.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Main message</text>
        <text x="92.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Form is part of content</text>
        <text x="92.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Any medium should instill clarity, editorial accuracy and discipline.</text>
        <text x="696.000" y="800.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Primary sign</text>
        <text x="1160.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Brand function</text>
        <text x="1160.000" y="400.460" font-family="Panton Black" font-size="21.000" fill="#000000">A platform, not an agency</text>
        <text x="1160.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">The brand is a framework for media formats, visual systems, author publications and</text>
        <text x="1160.000" y="461.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">digital media.</text>
        <text x="1160.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Operational conclusion</text>
        <text x="1160.000" y="651.940" font-family="Panton Black" font-size="19.000" fill="#000000">All materials must remain open to various formats</text>
        <text x="1160.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Each new medium follows the same logic: monochrome, hierarchy, whitespace and</text>
        <text x="1160.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">discipline.</text>
      </svg>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">A. Strategic framework</text>
        <text x="1827.904" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">06</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Difference, values ​​and character</text>
        <text x="92.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">How is it different?</text>
        <text x="92.000" y="402.680" font-family="Panton Black" font-size="18.000" fill="#000000">It works equally well as a brand and as an authoring framework</text>
        <text x="92.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">The system holds both studio presentation, editorial content and</text>
        <text x="92.000" y="461.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">personal cultural projects.</text>
        <text x="92.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Values</text>
        <text x="92.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Clarity</text>
        <text x="92.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Nothing should sound or</text>
        <text x="92.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">seems overcomplicated.</text>
        <text x="372.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Values</text>
        <text x="372.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Consistency</text>
        <text x="372.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Every use should be</text>
        <text x="372.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">recognizable as part of one</text>
        <text x="372.000" y="733.580" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">system.</text>
        <text x="700.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Values</text>
        <text x="700.000" y="400.460" font-family="Panton Black" font-size="21.000" fill="#000000">Independence</text>
        <text x="700.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">The brand does not adopt a ready-made language, but builds its own</text>
        <text x="700.000" y="461.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">editorial rhythm.</text>
        <text x="700.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Values</text>
        <text x="700.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Cultural burden</text>
        <text x="700.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Content is not treated as noise, but as the argument it should be</text>
        <text x="700.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">arranged.</text>
        <text x="1308.000" y="368.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Character</text>
        <text x="1308.000" y="400.460" font-family="Panton Black" font-size="21.000" fill="#000000">Minimal, editorial, precise</text>
        <text x="1308.000" y="440.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">The tone is calm, firm and measured.</text>
        <text x="1308.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">A code of conduct</text>
        <text x="1308.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">No visual noise</text>
        <text x="1308.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Decorative effects, random accents and cluttered compositions</text>
        <text x="1308.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">contradict d . media.</text>
      </svg>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">B. Identity</text>
        <text x="1833.856" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">11</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Variants, backgrounds and lockup logic</text>
        <text x="88.000" y="580.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Logotype on a light background</text>
        <text x="88.000" y="874.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Logotype on a dark background</text>
        <text x="956.000" y="580.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Primary sign</text>
        <text x="1344.000" y="580.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Reduced frame</text>
        <text x="960.000" y="692.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Basic rule</text>
        <text x="960.000" y="724.460" font-family="Panton Black" font-size="21.000" fill="#000000">First logo, then logo</text>
        <text x="960.000" y="764.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">If there is sufficient width and a readable field, it is</text>
        <text x="960.000" y="785.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">used the logo. Logo is the second choice for short</text>
        <text x="960.000" y="807.580" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">scale.</text>
        <text x="1428.000" y="692.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Lockup logic</text>
        <text x="1428.000" y="724.460" font-family="Panton Black" font-size="21.000" fill="#000000">Don&#x27;t rearrange the items</text>
        <text x="1428.000" y="764.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">No new compositions are created by mechanical</text>
        <text x="1428.000" y="785.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">displacement of the logo and the logo.</text>
        <text x="72.000" y="920.680" font-family="Panton Regular" font-size="18.000" fill="#000000">Broad formats such as web header, cover and document header use a logo. Small fields and square icon formats use the logo.</text>
      </svg>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">B. Identity</text>
        <text x="1831.424" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">12</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Geometry, protective field and dimensions</text>
        <text x="88.000" y="580.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Logotype in a constructive field</text>
        <text x="1200.000" y="407.640" font-family="Panton SemiBold" font-size="17.000" fill="#808080" letter-spacing="-0.015em">Defense field</text>
        <text x="1200.000" y="470.760" font-family="Panton Black" font-size="26.000" fill="#000000">0.5x</text>
        <text x="1538.000" y="407.640" font-family="Panton SemiBold" font-size="17.000" fill="#808080" letter-spacing="-0.015em">Minimum screen</text>
        <text x="1538.000" y="470.760" font-family="Panton Black" font-size="26.000" fill="#000000">140 px</text>
        <text x="1200.000" y="557.640" font-family="Panton SemiBold" font-size="17.000" fill="#808080" letter-spacing="-0.015em">Minimal printing</text>
        <text x="1200.000" y="620.760" font-family="Panton Black" font-size="26.000" fill="#000000">24 mm</text>
        <text x="1538.000" y="557.640" font-family="Panton SemiBold" font-size="17.000" fill="#808080" letter-spacing="-0.015em">Minimal icon</text>
        <text x="1538.000" y="620.760" font-family="Panton Black" font-size="26.000" fill="#000000">24 px</text>
        <text x="1200.000" y="740.680" font-family="Panton Regular" font-size="18.000" fill="#000000">Geometry is not a decorative scheme, but a means to preserve the optical</text>
        <text x="1200.000" y="764.680" font-family="Panton Regular" font-size="18.000" fill="#000000">balance, the space around the dot, and the visual weight of the d throughout the sign.</text>
        <text x="1200.000" y="842.680" font-family="Panton Regular" font-size="18.000" fill="#000000">For favicon, avatar and other small fields, the reduced one is used</text>
        <text x="1200.000" y="866.680" font-family="Panton Regular" font-size="18.000" fill="#000000">main logo, no stretching, no rotation and no separation of parts from</text>
        <text x="1200.000" y="890.680" font-family="Panton Regular" font-size="18.000" fill="#000000">the composition.</text>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">B. Identity</text>
        <text x="1831.232" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">13</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Correct and incorrect usage</text>
        <text x="88.000" y="600.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Correct: Confirmed option</text>
        <text x="646.000" y="600.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Error: unvalidated color</text>
        <text x="1064.000" y="600.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Wrong: deformed proportion</text>
        <text x="1482.000" y="600.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Wrong: orientation changed</text>
        <text x="92.000" y="678.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Correct use</text>
        <text x="92.000" y="710.460" font-family="Panton Black" font-size="21.000" fill="#000000">The right option for the right medium</text>
        <text x="92.000" y="750.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">The logo is kept for wide formats and the logo for compact and small</text>
        <text x="92.000" y="771.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">applications scale.</text>
        <text x="682.000" y="678.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Color errors</text>
        <text x="682.000" y="710.460" font-family="Panton Black" font-size="21.000" fill="#000000">No random coloring</text>
        <text x="682.000" y="750.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">It is not allowed to replace the monochrome system with arbitrary</text>
        <text x="682.000" y="771.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">colors, gradients and effects.</text>
        <text x="1272.000" y="678.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Formal errors</text>
        <text x="1272.000" y="710.460" font-family="Panton Black" font-size="21.000" fill="#000000">No stretching, rotation and false lockups</text>
        <text x="1272.000" y="750.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Stretching, twisting, separating parts and mechanical modification of the</text>
        <text x="1272.000" y="771.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">construction.</text>

        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Color system</text>

        <text x="92.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">RGB 0 0 0</text>
        <text x="92.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">CMYK 0 0 0 100</text>

        <text x="302.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">CMYK 0 0 0 50</text>
        <text x="512.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">#CCCCCC</text>
        <text x="512.000" y="654.160" font-family="Panton Black" font-size="16.000" fill="#000000">RGB 204 204 204</text>
        <text x="512.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">CMYK 0 0 0 20</text>
        <text x="722.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">#F2F2F2</text>
        <text x="722.000" y="653.420" font-family="Panton Black" font-size="17.000" fill="#000000">RGB 242 242 242</text>
        <text x="722.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">CMYK 0 0 0 5</text>
        <text x="970.000" y="398.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Color policy</text>
        <text x="970.000" y="431.200" font-family="Panton Black" font-size="20.000" fill="#000000">Monochromy with controlled gradation</text>
        <text x="970.000" y="470.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">The system kernel does not allow arbitrary addition of</text>
        <text x="970.000" y="491.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">accent colors.</text>
        <text x="1420.000" y="398.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Proportion</text>
        <text x="1420.000" y="431.200" font-family="Panton Black" font-size="20.000" fill="#000000">Black for content, gray for structure</text>
        <text x="1420.000" y="470.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Black holds the headline and main text, gray is for</text>
        <text x="1420.000" y="491.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">metadata and structure.</text>
        <text x="970.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Contrast</text>
        <text x="969.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">Readability is more important than effect</text>
        <text x="970.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">When the background weakens the contrast, it</text>
        <text x="970.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">switches to a clearer one option.</text>
        <text x="1420.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">What is avoided</text>
        <text x="1420.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">No decorative halftones</text>
        <text x="1420.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Random transparencies, textures and color overlays</text>
        <text x="1420.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">do not replace the hierarchy.</text>
      </svg>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">B. Identity</text>
        <text x="1830.896" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">16</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Typographic style and spelling in text</text>
        <text x="92.000" y="398.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Writing in text</text>
        <text x="92.000" y="430.460" font-family="Panton Black" font-size="21.000" fill="#000000">Always exact: d . media</text>
        <text x="92.000" y="470.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">No d.media, D . media, D.Media, d-media or other stylization.</text>
        <text x="92.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Eq</text>
        <text x="92.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Mostly left, rarely center</text>
        <text x="92.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">For longer texts, left alignment is used. The center is for covers and</text>
        <text x="92.000" y="711.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">single short formats.</text>
        <text x="92.000" y="838.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Rhythm</text>
        <text x="92.000" y="870.460" font-family="Panton Black" font-size="21.000" fill="#000000">Big breaks, not tight blocks</text>
        <text x="92.000" y="910.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">The text must breathe. Spacing and margins are not leftover space.</text>
        <text x="700.000" y="398.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Headline style</text>
        <text x="700.000" y="430.460" font-family="Panton Black" font-size="21.000" fill="#000000">Short, tight, argumentative</text>
        <text x="700.000" y="470.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Headlines work with simple structures and no advertising formulas.</text>
        <text x="700.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Caption style</text>
        <text x="700.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Factual and clean</text>
        <text x="700.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Captions and meta lines name, classify and give context.</text>
        <text x="700.000" y="838.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">In documents</text>
        <text x="700.000" y="871.940" font-family="Panton Black" font-size="19.000" fill="#000000">The text d . media can also stand as a typographic inscription</text>
        <text x="700.000" y="910.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">The name can be written with Panton Black in black, and if necessary with</text>
        <text x="700.000" y="931.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">the originals colors from the logo. For title and header areas, the original</text>
        <text x="700.000" y="953.580" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">logo is also permissible.</text>
        <text x="1308.000" y="398.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">An example</text>
        <text x="1308.000" y="430.460" font-family="Panton Black" font-size="21.000" fill="#000000">Form is part of content.</text>
        <text x="1308.000" y="470.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">A headline that sounds like a position, not an unsupported slogan.</text>
        <text x="1308.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">An example</text>
        <text x="1308.000" y="650.460" font-family="Panton Black" font-size="21.000" fill="#000000">Long-form editorial system.</text>
        <text x="1308.000" y="690.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">A subtitle that explains what&#x27;s to come without blowing the tone.</text>
        <text x="1308.000" y="838.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">An example</text>
        <text x="1308.000" y="872.680" font-family="Panton Black" font-size="18.000" fill="#000000">Note: use reduced logo at small scale.</text>
        <text x="1308.000" y="910.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Short instruction, written calmly and accurately.</text>
      </svg>
    </section>

        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Usage matrix</text>
        <text x="92.000" y="398.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Logotype</text>
        <text x="92.000" y="430.460" font-family="Panton Black" font-size="21.000" fill="#000000">Full bearer of the name</text>
        <text x="92.000" y="470.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">It is used where there is sufficient width, readability and the need</text>
        <text x="92.000" y="491.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">for completeness writing.</text>
        <text x="650.000" y="398.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Logo</text>
        <text x="650.000" y="430.460" font-family="Panton Black" font-size="21.000" fill="#000000">A compact recognizable sign</text>
        <text x="650.000" y="470.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">It is used in small scale, square formats, icon roles and system</text>
        <text x="650.000" y="491.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">miniatures.</text>
        <text x="1208.000" y="398.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Typographic inscription</text>
        <text x="1208.000" y="430.460" font-family="Panton Black" font-size="21.000" fill="#000000">Text usage in Panton Black</text>
        <text x="1208.000" y="470.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">It is acceptable in documents and title pages when the name works as part of an</text>
        <text x="1208.000" y="491.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">editorial composition.</text>
        <text x="92.000" y="618.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Logotype</text>

        <text x="1830.048" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">27</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Small format and icon applications</text>
        <text x="88.000" y="620.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">favicon</text>
        <text x="264.000" y="620.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">iOS</text>
        <text x="440.000" y="620.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Android</text>
        <text x="616.000" y="620.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">App</text>
        <text x="920.000" y="690.000" font-family="Panton SemiBold" font-size="16.000" fill="#808080" letter-spacing="-0.015em">Avatar and miniature system</text>
        <text x="92.000" y="822.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Basic rule</text>
        <text x="92.000" y="854.460" font-family="Panton Black" font-size="21.000" fill="#000000">The logo keeps the small scale</text>
        <text x="92.000" y="894.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">With small sizes, icons and system thumbnails, reduced becomes</text>
        <text x="92.000" y="915.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">the main thing logo, not the logo.</text>
        <text x="640.000" y="822.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Miniature logic</text>
        <text x="640.000" y="854.460" font-family="Panton Black" font-size="21.000" fill="#000000">The logo is not forcibly shrunk</text>
        <text x="640.000" y="894.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">When the field is too small for a legible logo, it is switched to the logo</text>
        <text x="640.000" y="915.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">instead to compromise readability.</text>
        <text x="1230.000" y="822.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Avatar logic</text>
        <text x="1230.000" y="854.460" font-family="Panton Black" font-size="21.000" fill="#000000">Clean center, generous field</text>
        <text x="1230.000" y="894.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Profile images and app icons should have enough air around the logo.</text>
      </svg>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">D. Applications</text>
        <text x="1828.560" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">28</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">Handoff package and file line</text>
        <text x="92.000" y="378.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Package</text>
        <text x="92.000" y="410.460" font-family="Panton Black" font-size="21.000" fill="#000000">Logos, fonts, colors, icons, templates, exports</text>
        <text x="92.000" y="450.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">The handoff package should be organized as a studio archive with clear</text>
        <text x="92.000" y="471.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">names and versions.</text>
        <text x="92.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">File line</text>
        <text x="92.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">Predictable names and clear versioning</text>
        <text x="92.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Names describe the asset type, variant, and context of use.</text>
        <text x="680.000" y="378.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">In partnerships</text>
        <text x="680.000" y="410.460" font-family="Panton Black" font-size="21.000" fill="#000000">Do not redo the assets locally</text>
        <text x="680.000" y="450.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Official assets are submitted to external studios and developers.</text>
        <text x="680.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">At exports</text>
        <text x="680.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">SVG / PDF / PNG according to the task</text>
        <text x="680.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">SVG for identity, PNG for preview and social, PDF for manuals and print</text>
        <text x="680.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">packages.</text>
        <text x="1268.000" y="378.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Required folders</text>
        <text x="1268.000" y="411.200" font-family="Panton Black" font-size="20.000" fill="#000000">logos / fonts / colors / icons / social / web / editorial / print</text>
        <text x="1268.000" y="450.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">This is the minimum package that keeps the system running.</text>
        <text x="1268.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Reserved field</text>
        <text x="1268.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">guidelines / approvals / exports</text>
        <text x="1268.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">These folders keep the version of rules, approved deviations and</text>
        <text x="1268.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">production exports.</text>
      </svg>

        <text x="72.000" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">D. Applications</text>
        <text x="1828.464" y="60.000" font-family="Panton SemiBold" font-size="17.500" fill="#808080" letter-spacing="-0.015em">29</text>
        <text x="72.000" y="96.840" font-family="Panton Black" font-size="34.000" fill="#000000">System management</text>
        <text x="92.000" y="378.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Management principle</text>
        <text x="92.000" y="410.460" font-family="Panton Black" font-size="21.000" fill="#000000">The system is tight but not closed</text>
        <text x="92.000" y="450.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">New media and campaign solutions are eligible if they flow through the</text>
        <text x="92.000" y="471.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">main ones system rules.</text>
        <text x="92.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">When is an exception permissible?</text>
        <text x="92.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">Only when the medium requires different behavior</text>
        <text x="92.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">An exception is allowed for a specific technological, print or platform</text>
        <text x="92.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">context.</text>
        <text x="680.000" y="378.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">How it is approved</text>
        <text x="680.000" y="410.460" font-family="Panton Black" font-size="21.000" fill="#000000">Compare with system kernel</text>
        <text x="680.000" y="450.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">Each new solution is tested against name, character, color, typography</text>
        <text x="680.000" y="471.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">and rhythm.</text>
        <text x="680.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">What is being kept?</text>
        <text x="680.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">Readability, whitespace and consistency</text>
        <text x="680.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">In any adaptation, the monochrome discipline, the typographic</text>
        <text x="680.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">discipline, must remain clarity and editorial density.</text>
        <text x="1268.000" y="378.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">Practical conclusion</text>
        <text x="1268.000" y="410.460" font-family="Panton Black" font-size="21.000" fill="#000000">New media = new app, not new identity</text>
        <text x="1268.000" y="450.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">A new format means a new application of the system, not a new style.</text>
        <text x="1268.000" y="638.380" font-family="Panton SemiBold" font-size="16.500" fill="#808080" letter-spacing="-0.015em">A final note</text>
        <text x="1268.000" y="670.460" font-family="Panton Black" font-size="21.000" fill="#000000">d . media should remain recognizable even when silent</text>
        <text x="1268.000" y="710.380" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">The strength of the brand comes from a permanent structure, intelligent</text>
        <text x="1268.000" y="731.980" font-family="Panton Regular" font-size="16.000" fill="#000000" letter-spacing="-0.012em">economy and respect for the content.</text>
